<svg style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif" viewBox="0 0 530 290" width="530" height="290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Circuit for -x = NOT x + 1 with 3 bits, laid out like column addition">
<rect x="0" y="0" width="530" height="290" rx="8" fill="#ffffff"/>
<defs>
<marker id="bvah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a949c"/></marker>
</defs>
<g style="font-size:11px; text-anchor:middle; font-weight:700; fill:#1f2937; opacity:0.6">
<text x="160" y="16">bit 2 (sign)</text><text x="300" y="16">bit 1</text><text x="440" y="16">bit 0</text>
</g>
<g fill="none" stroke="#8a949c" stroke-width="1.5" marker-end="url(#bvah)">
<path d="M160,58 V87"/><path d="M300,58 V87"/><path d="M440,58 V87"/>
<path d="M160,112 V144"/><path d="M300,112 V144"/><path d="M440,112 V144"/>
<path d="M160,193 V234"/><path d="M300,193 V234"/><path d="M440,193 V234"/>
<path d="M522,169 H491"/><path d="M390,169 H351"/><path d="M250,169 H211"/>
</g>
<path d="M110,169 H78" fill="none" stroke="#8a949c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#bvah)"/>
<g stroke="#8a949c" stroke-width="1.2" fill="rgba(128,128,128,0.12)">
<rect x="138" y="88" width="44" height="24" rx="4"/><rect x="278" y="88" width="44" height="24" rx="4"/><rect x="418" y="88" width="44" height="24" rx="4"/>
<rect x="110" y="145" width="100" height="48" rx="6"/><rect x="250" y="145" width="100" height="48" rx="6"/><rect x="390" y="145" width="100" height="48" rx="6"/>
</g>
<g stroke="#5d8392" stroke-width="1.5" fill="rgba(93,131,146,0.14)">
<rect x="270" y="28" width="60" height="30" rx="6"/><rect x="410" y="28" width="60" height="30" rx="6"/>
<rect x="270" y="235" width="60" height="30" rx="6"/><rect x="410" y="235" width="60" height="30" rx="6"/>
</g>
<g stroke="#dc2626" stroke-width="2.2" fill="rgba(220,38,38,0.1)">
<rect x="130" y="28" width="60" height="30" rx="6"/><rect x="130" y="235" width="60" height="30" rx="6"/>
</g>
<g style="font-size:13px; text-anchor:middle; font-weight:700; fill:#1f2937">
<text x="160" y="48">x2</text><text x="300" y="48">x1</text><text x="440" y="48">x0</text>
<text x="160" y="255">r2</text><text x="300" y="255">r1</text><text x="440" y="255">r0</text>
</g>
<g style="font-size:12px; text-anchor:middle; fill:#1f2937">
<text x="160" y="104">NOT</text><text x="300" y="104">NOT</text><text x="440" y="104">NOT</text>
</g>
<g style="font-size:10.5px; text-anchor:middle; fill:#1f2937">
<text x="160" y="165">XOR → sum</text><text x="160" y="181">AND → carry</text>
<text x="300" y="165">XOR → sum</text><text x="300" y="181">AND → carry</text>
<text x="440" y="165">XOR → sum</text><text x="440" y="181">AND → carry</text>
</g>
<g style="paint-order:stroke; stroke:#ffffff; stroke-width:3px; stroke-linejoin:round; font-size:11px; fill:#1f2937">
<text x="166" y="132">¬x2</text><text x="306" y="132">¬x1</text><text x="446" y="132">¬x0</text>
<text x="166" y="219">sum</text><text x="306" y="219">sum</text><text x="446" y="219">sum</text>
</g>
<g style="font-size:12px; text-anchor:middle; font-weight:700; fill:#1f2937">
<text x="508" y="161">1</text><text x="370" y="161">c1</text><text x="230" y="161">c2</text>
</g>
<g style="font-size:10.5px; text-anchor:middle; fill:#1f2937; opacity:0.6">
<text x="88" y="161">c3</text><text x="86" y="185">dropped</text>
</g>
<g style="font-size:11px; text-anchor:end; font-weight:700; fill:#dc2626">
<text x="122" y="40">goal: x2 = 1</text><text x="122" y="54">(x &lt; 0)</text>
<text x="122" y="247">goal: r2 = 1</text><text x="122" y="261">(−x &lt; 0)</text>
</g>
</svg>
